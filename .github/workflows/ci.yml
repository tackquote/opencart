name: CI

# Lint every PHP file and run the tests that can run without a live store.
#
# tests/run.php is self-contained: no composer, no phpunit, no database.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP
        run: |
          find . -path ./dist -prune -o -path ./vendor -prune -o -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Run tests
        run: php tests/run.php

      - name: Build release artifact(s)
        run: bash scripts/package.sh dist
